<style>
  .container {
    display: grid;
    grid-template-rows: 100px 100px 100px;
    grid-template-columns: 100px 100px 100px;
  }

  .item {
    background-color: orange;
    border: 1px solid black;
    text-align: center;
  }

  .first-row {
    background-color: pink;
  }

  .last-column {
    background-color: lightblue;
  }
</style>
<div class="container">
  <div class="item first-row">A</div>
  <div class="item first-row">B</div>
  <div class="item first-row last-column">C</div>
  <div class="item">D</div>
  <div class="item">E</div>
  <div class="item last-column">F</div>
  <div class="item">G</div>
  <div class="item">H</div>
  <div class="item last-column">I</div>
</div>

<style>
  .acontainer {
    display: inline-grid;
    grid-template: 40px 40px 40px 40px 40px / 40px 40px 40px 40px 40px;
    background-color: lightblue;
  }

  .room {
    border: 1px solid;
    font-size: 50%;
    text-align: center;
  }

  #living-room {
    grid-area: 1 / 1 / 3 / 6;
  }

  #kitchen {
    grid-column: 4 / 6;
    grid-row: 3 / 6;
  }

  #bedroom {
    grid-column-start: 2;
    grid-column-end: 4;
    grid-row-start: 3;
    grid-row-end: 5;
  }

  #bathroom {
    grid-column-start: 1;
    grid-column-end: 2;
    grid-row-start: 3;
    grid-row-end: 6;
  }

  #closet {
    grid-column-start: 2;
    grid-column-end: 4;
    grid-row-start: 5;
    grid-row-end: 6;
  }
</style>
<div class="acontainer">
  <div class="room" id="living-room">Living Room</div>
  <div class="room" id="kitchen">Kitchen</div>
  <div class="room" id="bedroom">Bedroom</div>
  <div class="room" id="bathroom">Bathroom</div>
  <div class="room" id="closet">Closet</div>
</div>

<style>
  .bcontainer {
    display: inline-grid;
    grid-template: 40px 40px 40px 40px 40px / 40px 40px 40px 40px 40px;
    background-color: lightblue;
    grid-template-areas:
      "living-room living-room living-room living-room living-room"
      "living-room living-room living-room living-room living-room"
      "bedroom bedroom bathroom kitchen kitchen"
      "bedroom bedroom bathroom kitchen kitchen"
      "closet closet bathroom kitchen kitchen";
  }

  .room {
    border: 1px solid;
    font-size: 50%;
    text-align: center;
  }

  #living-room {
    grid-area: living-room;
  }

  #kitchen {
    grid-area: kitchen;
  }

  #bedroom {
    grid-area: bedroom;
  }

  #bathroom {
    grid-area: bathroom;
  }

  #closet {
    grid-area: closet;
  }
</style>
<div class="bcontainer">
  <div class="room" id="living-room">Living Room</div>
  <div class="room" id="kitchen">Kitchen</div>
  <div class="room" id="bedroom">Bedroom</div>
  <div class="room" id="bathroom">Bathroom</div>
  <div class="room" id="closet">Closet</div>
</div>
