<style>
  form,
  label {
    display: flex;
    flex-direction: column;
  }

  form {
    max-width: 250px;
    gap: 12px;
  }
</style>

<form action="#" method="get">
  <label for="user_email">
    *Email:
    <input
      type="email"
      id="user_email"
      name="user_email"
      minlength="4"
      maxlength="60"
      required
    />
  </label>

  <label for="user_password">
    *Password:
    <input type="password" id="user_password" name="user_password" required />
  </label>

  <button type="submit">Login</button>
</form>

<form action="#" method="get">
  <label for="quantity">
    Quantity
    <input
      type="number"
      id="quantity"
      name="quantity"
      min="1"
      max="10"
      value="0"
    />
  </label>

  <button type="submit">Place Order</button>
</form>

<form action="#" method="get">
  <label for="zip_code">
    Postal / Zip Code:
    <input
      type="text"
      id="zip_code"
      name="zip_code"
      pattern="(\d{5}([\-]\d{4})?)"
      required
    />
  </label>

  <button type="submit">Submit</button>
</form>

<style>
  input:user-valid {
    border-color: green;
  }

  input:user-invalid {
    border-color: red;
  }

  input {
    border: 2px solid #000;
    padding: 5px;
    border-radius: 5px;
  }

  form,
  label {
    display: flex;
    flex-direction: column;
  }

  form {
    max-width: 250px;
    gap: 12px;
  }
</style>

<form action="#" method="get">
  <label for="email">
    Email
    <input type="email" id="email" name="email" />
  </label>

  <label for="website">
    Website
    <input type="url" id="website" name="website" />
  </label>

  <button type="submit">Submit</button>
</form>
