<style>
  p {
    color: rgb(0, 42, 255);
    background: linear-gradient(90deg, blue, red);
  }
  :root {
    --header: 3rem;
    --footer: 40px;
    --main: calc(100vh - calc(var(--header) + var(--footer)));
  }

  body {
    margin: 0;
    padding: 0;
    border: 0px solid transparent;
    background: #7a7a7a;
  }

  #container {
    border: 0px solid transparent;
    height: 100vh;
    color: white;
  }
  #container > * {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #header {
    height: var(--header);
    background: #111111;
  }
  #mainContent {
    height: var(--main);
    background: #343434;
    margin-right: auto;
    margin-left: auto;
  }
  #footer {
    height: var(--footer);
    background: #232323;
  }
  #container {
    display: flex;
    box-sizing: border-box;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 6px solid black;
    resize: both;
    overflow: auto;
    max-width: 100%;
    max-height: 100%;
  }

  #iconHolder {
    width: min(150px, 100%);
    height: max(100px, 4em, 50%);
    height: min(150px, 100%);
    box-sizing: border-box;
    border: 6px solid blue;
  }

  p {
    margin-block: 0;
  }
</style>
<p>Felipe</p>
<body>
  <div id="container">
    <header id="header">< header /></header>
    <main id="mainContent">< main content /></main>
    <footer id="footer">< footer /></footer>
  </div>
</body>

<body>
  <p id="text">Resize me by dragging the bottom right corner</p>
  <div id="container">
    <img
      id="iconHolder"
      src="https://avatars.githubusercontent.com/u/4441966?s=200&v=4"
      alt="odin image"
    />
  </div>
</body>
